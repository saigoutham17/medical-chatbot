<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Assistant — RAG Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .chat-header h4 {
            margin: 0;
            font-weight: 600;
        }
        .chat-header p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .bot-message {
            background: #f1f5f9;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-message {
            background: #0d6efd;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .chat-footer {
            padding: 16px 20px;
            border-top: 1px solid #e2e8f0;
            background: #fafafa;
        }
        .input-group {
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .input-group input {
            border: none;
            padding: 14px 20px;
        }
        .input-group input:focus {
            box-shadow: none;
        }
        .btn-send {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 0 24px;
        }
        .btn-send:hover {
            background: #0b5ed7;
            color: white;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <i class="fa-solid fa-user-doctor fa-2x"></i>
            <div>
                <h4>Medical AI Assistant</h4>
                <p>Powered by LangChain, Pinecone Vector DB & Google Gemini</p>
            </div>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="message bot-message">
                Hello! I am your AI Medical Assistant trained on clinical literature. How can I assist you with your health or medical questions today?
            </div>
        </div>
        <div class="chat-footer">
            <form id="chatForm">
                <div class="input-group">
                    <input type="text" id="userInput" class="form-control" placeholder="Type your medical query here (e.g., symptoms of allergies)..." required autocomplete="off">
                    <button class="btn btn-send" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById('chatBody');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Append user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = message;
            chatBody.appendChild(userDiv);
            userInput.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;

            // Show typing placeholder
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message';
            typingDiv.innerHTML = '<em>Searching medical literature & analyzing...</em>';
            chatBody.appendChild(typingDiv);
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                const response = await fetch('/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ msg: message })
                });
                const data = await response.text();
                typingDiv.textContent = data;
            } catch (err) {
                typingDiv.textContent = "Error: Unable to connect to medical knowledge base. Please try again.";
            }
            chatBody.scrollTop = chatBody.scrollHeight;
        });
    </script>
</body>
</html>
